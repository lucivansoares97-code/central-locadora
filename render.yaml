services:
  - type: web
    name: locadora-central
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: locadora-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENROLLMENT_KEY
        sync: false
      - key: APP_NAME
        value: Central da Locadora
      - key: PYTHON_VERSION
        value: "3.12.10"

databases:
  - name: locadora-db
    plan: free
    databaseName: locadora
    user: locadora_user
